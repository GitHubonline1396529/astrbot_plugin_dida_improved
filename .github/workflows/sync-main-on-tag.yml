# Sync release files from dev to main when a v* tag is pushed.
# This is the ONLY channel through which main should be updated.
# Files are taken from release-manifest.json: `files` are staged as-is,
# `copies` are copied/renamed (e.g. docs/changelog.md -> CHANGELOG.md).
name: sync release to main

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: create clean main branch
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan release-temp
          git rm -rf --cached .
          FILES=$(python -c "import json; print(' '.join(json.load(open('release-manifest.json'))['files']))")
          git add $FILES
          python -c "import json,shutil; m=json.load(open('release-manifest.json')); [shutil.copyfile(c['src'], c['dest']) for c in m.get('copies', [])]"
          COPIED=$(python -c "import json; print(' '.join(c['dest'] for c in json.load(open('release-manifest.json')).get('copies', [])))")
          if [ -n "$COPIED" ]; then git add $COPIED; fi
          git commit -m "release: ${TAG_NAME}"
          git branch -f main release-temp
          git push origin main --force
